# ScrapForge — build and publish binaries for every platform.
#
# HOW TO INSTALL (GitHub blocks apps from pushing to .github/workflows):
#   1. create the folder .github/workflows in the repository root
#   2. copy this file there:  cp ci/release.yml .github/workflows/release.yml
#   3. git add .github && git commit -m "ci: release builds" && git push
#
# HOW TO TRIGGER A RELEASE:
#   git tag v0.1.0 && git push origin v0.1.0
# GitHub then builds Linux / Windows / macOS binaries and attaches them to a
# release named after the tag.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Leave empty to build the current commit."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: scrapforge
            archive: scrapforge-linux-x86_64.tar.gz
            deps: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libasound2-dev libudev-dev pkg-config build-essential

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: scrapforge.exe
            archive: scrapforge-windows-x86_64.zip
            deps: ""

          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: scrapforge
            archive: scrapforge-macos-x86_64.tar.gz
            deps: ""

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: scrapforge
            archive: scrapforge-macos-aarch64.tar.gz
            deps: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install system dependencies
        if: matrix.deps != ''
        shell: bash
        run: ${{ matrix.deps }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: target/${{ matrix.target }}/release
        run: |
          cp ../../../README.md ../../../LICENSE* . 2>/dev/null || true
          tar -czf ${{ matrix.archive }} ${{ matrix.binary }} README.md

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: target/${{ matrix.target }}/release
        run: |
          cp ../../../README.md . || true
          7z a ${{ matrix.archive }} ${{ matrix.binary }} README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.archive }}
          if-no-files-found: error

  web:
    name: web-wasm
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true # a broken trunk build must not block the binaries
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        run: cargo install --locked trunk

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config

      - name: Build the web bundle
        run: trunk build --release --public-url game/

      - name: Upload the web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
